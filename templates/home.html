<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            width: 450px;
            animation: fadeIn 0.8s ease-in-out;
        }
        .form-container h1 {
            text-align: center;
            color: #2d3436;
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3436;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            font-size: 14px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #0984e3;
            outline: none;
            background: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 132, 227, 0.1);
        }
        .form-group input[type="submit"] {
            background: #0984e3;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            padding: 14px;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .form-group input[type="submit"]:hover {
            background: #065db1;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        .form-group input[type="submit"]:active {
            transform: translateY(1px);
            box-shadow: none;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .note {
            text-align: center;
            color: #636e72;
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Patient Details</h1>
        <form method="POST" action="/predict_datapoint">
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required>
            </div>
            <div class="form-group">
                <label for="sex">Sex:</label>
                <select id="sex" name="sex" required>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            <div class="form-group">
                <label for="on_thyroxine">On Thyroxine:</label>
                <select id="on_thyroxine" name="on_thyroxine" required>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="sick">Sick:</label>
                <select id="sick" name="sick" required>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="pregnant">Pregnant:</label>
                <select id="pregnant" name="pregnant" required>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="I131_treatment">I131 Treatment:</label>
                <select id="I131_treatment" name="I131_treatment" required>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="query_hypothyroid">Query Hypothyroid:</label>
                <select id="query_hypothyroid" name="query_hypothyroid" required>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="goitre">Goitre:</label>
                <select id="goitre" name="goitre" required>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="psych">Psych:</label>
                <select id="psych" name="psych" required>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="TSH">TSH:</label>
                <input type="number" id="TSH" name="TSH" step="any" required>
            </div>
            <div class="form-group">
                <label for="T3">T3:</label>
                <input type="number" id="T3" name="T3" step="any" required>
            </div>
            <div class="form-group">
                <label for="TT4">TT4:</label>
                <input type="number" id="TT4" name="TT4" step="any" required>
            </div>
            <div class="form-group">
                <label for="T4U">T4U:</label>
                <input type="number" id="T4U" name="T4U" step="any" required>
            </div>
            <div class="form-group">
                <label for="FTI">FTI:</label>
                <input type="number" id="FTI" name="FTI" step="any" required>
            </div>
            <div class="form-group">
                <label for="referral_source">Referral Source:</label>
                <select id="referral_source" name="referral_source" required>
                    <option value="SVHC">SVHC</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <input type="submit" value="Predict">
            </div>
        </form>
        <div class="note">Make sure all fields are filled before submitting.</div>
    </div>
</body>
</html>
